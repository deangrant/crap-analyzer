name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0

      - name: Check workspace membership and lint inheritance
        run: python3 .github/scripts/check-workspace.py

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Detect workspace packages
        id: pkgs
        run: |
          count=$(.github/scripts/package-count.sh)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" = "0" ]; then
            echo "No workspace packages; skipping rustfmt."
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.pkgs.outputs.count != '0'

      - run: cargo fmt --all -- --check
        if: steps.pkgs.outputs.count != '0'

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Detect workspace packages
        id: pkgs
        run: |
          count=$(.github/scripts/package-count.sh)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" = "0" ]; then
            echo "No workspace packages; skipping clippy."
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.pkgs.outputs.count != '0'

      - name: Clippy
        if: steps.pkgs.outputs.count != '0'
        run: |
          extra=()
          if [ -f Cargo.lock ]; then
            extra+=(--locked)
          fi
          cargo clippy --workspace --all-targets --all-features "${extra[@]}" -- -D warnings

  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check the 500-line file cap
        run: |
          if ! find . -name '*.rs' ! -path '*/target/*' ! -path '*/.git/*' \
            | grep -q .; then
            echo "No Rust files; skipping 500-line cap."
            exit 0
          fi
          over=$(find . -name '*.rs' ! -path '*/target/*' ! -path '*/.git/*' \
            -print0 | xargs -0 wc -l \
            | awk '$NF != "total" && $1 > 500 { print $1 " " $2 }')
          if [ -n "${over}" ]; then
            echo "These files exceed the 500-line cap:"
            echo "${over}"
            exit 1
          fi

