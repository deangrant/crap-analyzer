[package]
name = "crap-go"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Score Go functions by combining complexity and test coverage"
readme = "../../README.md"
repository = "https://github.com/deangrant/rust-crap"
keywords = ["coverage", "complexity", "metrics", "go"]
categories = ["development-tools::testing"]

[[bin]]
name = "crap-go"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crap-core = { path = "../crap-core", version = "0.1.0" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
