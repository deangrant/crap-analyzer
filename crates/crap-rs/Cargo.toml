[package]
name = "crap-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Score Rust functions by combining complexity and test coverage"
readme = "../../README.md"
repository = "https://github.com/deangrant/rust-crap"
keywords = ["coverage", "complexity", "metrics", "rust"]
categories = ["development-tools::testing"]

[[bin]]
name = "crap-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crap-core = { path = "../crap-core" }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
